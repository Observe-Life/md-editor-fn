name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fnpack (official fnOS packaging CLI)
        run: |
          curl -sSL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3 || true
      - run: npm ci
      - run: npm run build:fpk
      - uses: actions/upload-artifact@v4
        with:
          name: md-editor-fn-fpk
          path: build/**/*.fpk
